name: Daily Report Licitaciones

on:
  schedule:
    # 10:00 y 22:00 UTC = 06:00 y 18:00 hora Chile (UTC-4, invierno).
    # Cuando Chile cambie de horario (verano, UTC-3), hay que restar 1 hora más
    # a estos valores (ej: 09:00 y 21:00 UTC) para que caiga a la misma hora local.
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily report
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python run_cron.py daily-report